name: Build WordPress packages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIPs
        run: |
          rm -rf dist
          mkdir -p dist/theme dist/plugin
          cp -R wp-content/themes/havenstone dist/theme/havenstone
          cp -R wp-content/plugins/havenstone-core dist/plugin/havenstone-core
          cd dist/theme && zip -r ../../havenstone-theme.zip havenstone
          cd ../plugin && zip -r ../../havenstone-core.zip havenstone-core
          cd ../..
          mkdir -p dist/packages
          mv havenstone-theme.zip havenstone-core.zip dist/packages/

      - name: Upload WordPress packages
        uses: actions/upload-artifact@v4
        with:
          name: havenstone-wordpress-packages
          path: dist/packages/*.zip
          retention-days: 30
